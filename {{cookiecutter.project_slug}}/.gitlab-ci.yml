image: python:{{ cookiecutter.python_version }}

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  paths:
    - .cache/pip/
    - .cache/uv/
    - .venv/

before_script:
  - pip install uv
  - uv sync --group dev

stages:
  - test
  - lint
  - deploy

test:
  stage: test
  script:
    - uv run pytest --cov={{ cookiecutter.project_slug }} tests/

lint:
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy {{ cookiecutter.project_slug }}

deploy:
  stage: deploy
  script:
    - uv build
    - uv publish dist/* --username $PYPI_USERNAME --password $PYPI_PASSWORD
  only:
    - tags

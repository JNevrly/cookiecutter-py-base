[tox]
skipsdist = True
envlist = lint{% if cookiecutter.python_version == '3.11' %}, py311{% endif %}{% if cookiecutter.python_version in ['3.11', '3.12'] %}, py312{% endif %}, py313

[testenv:lint]
deps = uv
skip_install = true
setenv =
    PYTHONPATH = {toxinidir}
commands =
    uv run ruff check .
    uv run ruff format --check .
    uv run mypy {{ cookiecutter.project_slug }}

[testenv]
deps = uv
skip_install = true
setenv =
    PYTHONPATH = {toxinidir}
commands_pre = uv sync --group dev
{% if cookiecutter.use_pytest == "y" -%}
commands =
    uv run pytest --cov={{ cookiecutter.project_slug }} tests/
{% else %}
commands = uv run python -m test
{%- endif %}

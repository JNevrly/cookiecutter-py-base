[tox]
skipsdist = True
envlist = lint{% if cookiecutter.python_version == '3.11' %}, py311{% endif %}{% if cookiecutter.python_version in ['3.11', '3.12'] %}, py312{% endif %}, py313

[testenv:lint]
allowlist_externals =
    poetry
commands =
    poetry install -v
    poetry run ruff check .
    poetry run ruff format --check .
    poetry run mypy {{ cookiecutter.project_slug }}

[testenv]
allowlist_externals = poetry
skip_install = true
setenv =
    PYTHONPATH = {toxinidir}
{% if cookiecutter.use_pytest == "y" -%}
commands =
    poetry install -v
    poetry run pytest --cov={{ cookiecutter.project_slug }} tests/
{% else %}
commands = poetry run python -m test
{%- endif %}
